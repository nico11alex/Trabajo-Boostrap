<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 shadow overflow-hidden h-100">
            <div class="col-md-6 d-none d-md-block p-0">
                <img src="photos/imagendentro2.png" alt="" class="registro-img rounded-start">
            </div>
            <div class="col-md-6 col-12 p-5 bg-white d-flex flex-column justify-content-start">
                <h3 class="mb-4">REGISTRO</h3>
                <form action="login.html">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Registrarme</button>
                    <p class="text-center mt-3">
                        ¿Ya tienes cuenta?
                        <a href="login.html">Iniciar sesión</a>
                    </p>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
